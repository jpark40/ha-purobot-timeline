name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install Pillow
      - name: Verify package
        run: |
          python3 scripts/validate.py
          python3 -m unittest discover -s tests -v
