name: HACS validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with HACS
        uses: hacs/action@main
        with:
          category: integration
          comment: "false"
          # Default-catalog submission requires a license; custom installs do not.
          # Preserve the owner\'s licensing choice instead of assigning one.
          ignore: license
